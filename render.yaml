# Render Blueprint — staging infrastructure as code (ADR-0017).
#
# This Blueprint provisions the staging environment; no separate production
# environment is modelled yet (ADR-0017 addendum).
#
# Two services: the Fastify API (Docker web service) and the Vite SPA (static site
# on the free CDN). The database is NOT declared here — it is the existing external
# Supabase Postgres, reached over DATABASE_URL (ADR-0009). Both services are on the
# free tier, so neither auto-deploys: CI applies migrations first, then triggers the
# Render Deploy Hooks, so schema and code cut over together (ADR-0017). See
# docs/deploy/readme.md for the one-time setup and the secrets each service needs.
services:
  # ------------------------------------------------------------------ API --
  # Fastify on persistent-ish Node, run as a Docker image so the environment and the
  # CSP/header parity are ours to pin. Free tier: spins down when idle, cold-starts on
  # the next request, and the unattended Drive backstop poll degrades accordingly
  # (login-triggered and manual resync still work) — accepted in ADR-0017.
  - type: web
    name: burgers-bar-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    # Free tier bills preview instances against the same quota; keep them off.
    previews:
      generation: "off"
    envVars:
      - key: NODE_ENV
        value: production
      # Cross-service origins. Deterministic https://<service>.onrender.com literals
      # from the static site's name below — @fastify/cors needs a full origin, and the
      # invite/reset links are built from APP_BASE_URL (ADR-0008). fromService yields a
      # bare host with no scheme and render.yaml cannot concatenate, so these are pinned
      # literals; update them together if a service is renamed.
      - key: CORS_ORIGIN
        value: https://burgers-bar-todo.onrender.com
      - key: APP_BASE_URL
        value: https://burgers-bar-todo.onrender.com
      # Secrets — declared as keys only (sync: false). Render prompts for the value on
      # first Blueprint sync; nothing sensitive is committed. Mirrors .env.example.
      - key: DATABASE_URL
        sync: false
      # Assistant LLM provider — a boot-time switch, not a fallback (ADR-0018). Staging
      # runs Gemini: its free tier lets the Assistant answer at zero cost, where OpenRouter
      # needs paid credits. Flip ASSISTANT_PROVIDER to openrouter to switch (and supply that
      # key). The unselected provider's key may be left blank on first sync. ASSISTANT_MODEL
      # is intentionally unset so the gemini preset default (gemini-flash-latest) applies;
      # set it to override the routed model.
      - key: ASSISTANT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: DRIVE_CORPUS_FOLDER_ID
        sync: false
      # Transactional mail over Gmail SMTP in prod (ADR-0008). Host/port/secure are
      # non-secret config; the account and app-password are secrets.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # First-admin bootstrap (ADR-0005). Seeded once, by hand, per the deploy runbook
      # (ADR-0017); the password is supplied for that one run and is never a literal here.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  # ------------------------------------------------------------------ SPA --
  # The built Vite bundle on Render's global CDN. This is also the CSP enforcement
  # point: vite.config.ts carries the same policy as a meta tag in the bundle, but the
  # enforcing copy — including frame-ancestors, which meta tags cannot express — is the
  # response header set below (ADR-0006, ADR-0017).
  - type: web
    name: burgers-bar-todo
    runtime: static
    autoDeploy: false
    previews:
      generation: "off"
    # Build at the repo root so the npm workspace resolves; VITE_API_BASE_URL is baked
    # into the bundle at build time (it is the only value the SPA reads — ADR-0010).
    buildCommand: npm ci && npm run build --workspace @burgers/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://burgers-bar-api.onrender.com
    # Client-side routing: every unmatched path serves the SPA entry.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The enforcing CSP. connect-src is pinned to the API origin (a header value, so
      # it must be a literal); script-src 'self' is what guards the JavaScript-reachable
      # bearer token, and frame-ancestors 'none' is the clickjacking defence that a meta
      # tag cannot provide. Keep in lockstep with vite.config.ts's meta policy.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://burgers-bar-api.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
      # Fingerprinted assets are immutable and safe to cache forever; the un-hashed
      # entry document must revalidate so a new deploy's asset hashes are picked up.
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
