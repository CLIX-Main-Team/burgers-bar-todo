# Render Blueprint — staging API (ADR-0017; 2026-08 platform move).
#
# The SPA moved to Vercel (vercel.json at the repo root); this Blueprint now provisions only
# the Fastify API. The database is NOT declared here — it is the owner's own external Supabase
# Postgres, reached over DATABASE_URL (ADR-0009). Free tier, so it does not auto-deploy: CI
# applies migrations first, then triggers a Render deploy via the Render API, then deploys the
# SPA on Vercel — schema and both surfaces cut over together (ADR-0017, docs/deploy/readme.md).
#
# The live service was provisioned directly via the Render API (not a Blueprint sync) because
# the owner's account needed a one-time GitHub App authorization first; this file is the source
# of truth for its intended config and is what a future Blueprint re-sync would reconcile to.
services:
  - type: web
    name: burgers-bar-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    # Free tier bills preview instances against the same quota; keep them off.
    previews:
      generation: "off"
    envVars:
      - key: NODE_ENV
        value: production
      # Cross-service origin, now Vercel's project domain. @fastify/cors needs a full origin, and
      # the invite/reset links are built from APP_BASE_URL (ADR-0008). Pinned literal — update it
      # if the Vercel project or a custom domain changes (keep in lockstep with vercel.json's
      # CSP connect-src, which points the other way, at this service's own URL).
      - key: CORS_ORIGIN
        value: https://burgers-bar-todo.vercel.app
      - key: APP_BASE_URL
        value: https://burgers-bar-todo.vercel.app
      # Secrets — declared as keys only (sync: false). Render prompts for the value on
      # first Blueprint sync; nothing sensitive is committed. Mirrors .env.example.
      - key: DATABASE_URL
        sync: false
      # Assistant LLM provider — a boot-time switch, not a fallback (ADR-0018, ADR-0022). Runs
      # OpenRouter with ASSISTANT_MODEL pinned to the latest Gemini Pro (2026-08 owner decision,
      # replacing 3.6 Flash after the client's quality verdict) — a paid model (~$2/M in,
      # $12/M out ≈ a cent or two per answer), billed to the OpenRouter account. Flip
      # ASSISTANT_PROVIDER to gemini or groq to switch back (and supply that key). The
      # unselected providers' keys may be left blank on first sync. The retrieval index
      # (ADR-0025) embeds through the same OpenRouter key; no extra env needed.
      - key: ASSISTANT_PROVIDER
        value: openrouter
      - key: ASSISTANT_MODEL
        value: google/gemini-3.1-pro-preview
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Drive knowledge corpus (ADR-0014, ADR-0021) — both REQUIRED at boot: the server fails fast
      # if either is absent or malformed, so a misconfigured deploy never runs an empty knowledge
      # base. GOOGLE_SERVICE_ACCOUNT_JSON is the service-account key JSON, base64-encoded.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      # Transactional mail over Gmail SMTP in prod (ADR-0008). Host/port/secure are
      # non-secret config; the account and app-password are secrets.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # First-admin bootstrap (ADR-0005). Seeded once, by hand, per the deploy runbook
      # (ADR-0017); the password is supplied for that one run and is never a literal here.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
