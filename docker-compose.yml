# Local dev infrastructure only — Postgres and mailpit (ADR-0010).
# The Fastify API and the Vite dev server run on the host, not in containers, so
# reload and debugging stay native and CORS/bearer are exercised across split origins.
services:
  db:
    # Pinned to the Supabase project's major (17), in its pgvector build — migration 0016
    # stores embeddings as a vector column, which prod's Supabase ships built in and the
    # plain postgres image lacks. Never :latest — a silent major jump would diverge local
    # from the prod engine on the surface auth exercises.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burgers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burgers}
      POSTGRES_DB: ${POSTGRES_DB:-burgers}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP (-h 127.0.0.1), not the default Unix socket. On a fresh volume
      # the image runs a temporary init server that listens on the socket only, with
      # TCP disabled; a socket probe reports healthy during that window, so `up --wait`
      # unblocks and `make migrate` races the real server's startup and loses its work
      # (empty DB after `make reset`). A TCP probe can only pass once the real server
      # is listening on 5432. start_period keeps early failures from burning retries.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-burgers} -d ${POSTGRES_DB:-burgers}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  mailpit:
    # Local SMTP sink; the invite/reset mailer points here in dev, at real SMTP in prod.
    # Pinned, not :latest — a dev sink still shouldn't drift underfoot between clones.
    image: axllent/mailpit:v1.22.3
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  db-data:
