<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell's header and tab bar read env(safe-area-inset-*)
         so they clear the notch and home indicator on phones (PRD, story 7). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Burgers Bar</title>
    <!-- Brand icon set (ADR-0016, issue #107; owner call 2026-08). The tab icon is the
         site's own favicon PNG served verbatim — the staff app's tab reads exactly like
         burgersbar.co.il's — with the .ico as the legacy fallback. Homescreen/PWA tiles
         keep the cream mark on the brand-gradient tile, drawn from the design tokens
         (assets/brand/generate-app-icons.mjs). -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="252x252" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Add-to-Home-Screen is how the app reaches an iPhone (owner call 2026-08-11: the iOS
         wrapper is deferred, the PWA is the delivery route), so the standalone hint is spelled
         both ways. iOS 15.4+ honours the manifest's display:standalone on its own; the apple-
         prefixed name is what older iOS reads, and the unprefixed one is the standard that
         replaced it — Chrome warns about the apple- name alone. Neither affects the Capacitor
         shells, which are already full-screen native. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The light theme's chrome tint: the brand chocolate (--bb-brown), the gradient's dark
         stop, since chrome can't gradient. Keep this in sync with the manifest theme_color
         (both emitted from BROWN in assets/brand/generate-app-icons.mjs). Dark mode overrides
         it to the near-black canvas — below before paint, and in theme.tsx on every toggle. -->
    <meta name="theme-color" content="#5F4A32" />
    <!-- Pre-paint theme read (issue #101): apply the stored dark class before the app
         mounts so a return visit in dark mode never flashes light first. This mirrors the
         ThemeProvider's rule exactly — default light, and no prefers-color-scheme read (a
         dark OS with no stored choice still opens light, the class-based-explicit decision
         from #68). The provider takes over once React has mounted, on the same key. -->
    <script>
      try {
        if (localStorage.getItem('burgers.theme') === 'dark') {
          document.documentElement.classList.add('dark')
          /* Same literal as THEME_COLOR_DARK / --bb-neutral-950; no stylesheet has resolved
             this early, so the value can't be read from the token layer. */
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', '#151412')
        }
      } catch (e) {
        /* A non-readable storage just leaves the default light theme in place. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
