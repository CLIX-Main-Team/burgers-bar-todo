<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell's header and tab bar read env(safe-area-inset-*)
         so they clear the notch and home indicator on phones (PRD, story 7). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Burgers Bar</title>
    <!-- Brand icon set (ADR-0016, issue #107; owner call 2026-08). The tab icon is the
         site's own favicon PNG served verbatim — the staff app's tab reads exactly like
         burgersbar.co.il's — with the .ico as the legacy fallback. Homescreen/PWA tiles
         keep the cream mark on the brand-gradient tile, drawn from the design tokens
         (assets/brand/generate-app-icons.mjs). -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="252x252" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Add-to-Home-Screen is how the app reaches an iPhone (owner call 2026-08-11: the iOS
         wrapper is deferred, the PWA is the delivery route), so the standalone hint is spelled
         both ways. iOS 15.4+ honours the manifest's display:standalone on its own; the apple-
         prefixed name is what older iOS reads, and the unprefixed one is the standard that
         replaced it — Chrome warns about the apple- name alone. Neither affects the Capacitor
         shells, which are already full-screen native. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The chrome tint: the brand-black board (--bb-nav-surface) in BOTH themes — The
         This literal is the LIGHT value only — the pre-paint default, since the app opens
         light unless storage says otherwise; ThemeProvider repoints it to the dark value on
         mount (round 14, 2026-08-27, which ended the one-black-chrome-for-both-themes rule).
         Keep in sync with THEME_COLOR_LIGHT/DARK (theme.tsx) and the manifest theme_color
         (assets/brand/generate-app-icons.mjs). -->
    <meta name="theme-color" content="#0C0E11" />
    <!-- Pre-paint theme read (issue #101): stamp the theme before the app mounts so a return
         visit never flashes the wrong one. This mirrors the ThemeProvider's rule exactly —
         default DARK since 2026-08-27, and still no prefers-color-scheme read (a light OS with
         no stored choice opens dark, the class-based-explicit decision from #68).
         Note the test is for the LIGHT opt-out, not for dark: the class has to go on unless
         something says otherwise, so an unreadable storage lands on dark like every other
         unknown. The provider takes over once React has mounted, on the same key. -->
    <script>
      try {
        if (localStorage.getItem('burgers.theme') !== 'light') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* A non-readable storage still gets the dark default. */
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
