<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell's header and tab bar read env(safe-area-inset-*)
         so they clear the notch and home indicator on phones (PRD, story 7). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Burgers Bar</title>
    <!-- Brand icon set (ADR-0016, issue #107; owner call 2026-08). The tab icon is the
         site's own favicon PNG served verbatim — the staff app's tab reads exactly like
         burgersbar.co.il's — with the .ico as the legacy fallback. Homescreen/PWA tiles
         keep the cream mark on the brand-gradient tile, drawn from the design tokens
         (assets/brand/generate-app-icons.mjs). -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="252x252" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The brand chocolate (--bb-brown), so the browser/OS chrome tints to the brand
         (the gradient's dark stop — chrome can't gradient). Keep this in sync with the
         manifest theme_color (both emitted from BROWN in
         assets/brand/generate-app-icons.mjs). -->
    <meta name="theme-color" content="#5F4A32" />
    <!-- Pre-paint theme read (issue #101): apply the stored dark class before the app
         mounts so a return visit in dark mode never flashes light first. This mirrors the
         ThemeProvider's rule exactly — default light, and no prefers-color-scheme read (a
         dark OS with no stored choice still opens light, the class-based-explicit decision
         from #68). The provider takes over once React has mounted, on the same key. -->
    <script>
      try {
        if (localStorage.getItem('burgers.theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* A non-readable storage just leaves the default light theme in place. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
