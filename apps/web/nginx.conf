# nginx site config for the SPA container (2026-08 VPS move). Replaces what vercel.json
# declared on Vercel: the SPA fallback rewrite, the security headers, and the two cache
# policies. TLS is not here — Traefik terminates HTTPS and proxies plain HTTP to this
# container on the internal docker network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # vercel.json: "/(.*)" -> /index.html. Real files win; anything else is the app.
    location / {
        include /etc/nginx/nginx-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # vercel.json: /assets/* immutable for a year. Vite fingerprints these filenames,
    # so a changed file is a changed URL and stale caches cannot serve wrong code.
    location /assets/ {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # vercel.json: index.html no-cache, so a deploy is picked up on next load.
    location = /index.html {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
