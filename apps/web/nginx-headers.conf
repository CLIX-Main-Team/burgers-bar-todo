# Shared response headers (2026-08 VPS move). Split into an include because nginx's
# add_header is NOT inherited once a block declares its own — both the SPA fallback and
# the immutable-assets location add headers, so each must re-include the full set or
# silently lose the security headers. This mirrors vercel.json's "/(.*)" header block.
#
# The CSP is the same policy vite.config.ts's cspMeta() injects as a meta tag, with
# connect-src collapsed to 'self': same-origin /api means there is no cross-origin API
# host left to allow. Serving it as a real header (not just the baked meta tag) also
# covers responses that never parse the HTML.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
