:root{
  color-scheme:light;
  --bb-white:#FFFFFF;
  --bb-gold-100:#FBE6C4;--bb-gold-200:#F0C877;--bb-gold-400:#F4A81D;
  --bb-gold-700:#A2680A;--bb-gold-800:#7C4A0C;--bb-gold-950:#3A2C10;
  --bb-cream-50:#FBF6EC;--bb-cream-100:#F1E7D5;--bb-cream-150:#E8D9BF;
  --bb-cream-200:#E9DCC7;--bb-cream-300:#E0D0B8;--bb-cream-400:#C9B48F;
  --bb-clay-300:#AD9E82;--bb-clay-500:#77664F;--bb-clay-800:#3A2E1C;
  --bb-ink-700:#43351F;--bb-ink-750:#352A1B;--bb-ink-800:#2A2216;
  --bb-ink-850:#211A11;--bb-ink-900:#1F1910;--bb-ink-950:#15110A;--bb-ink-max:#23180A;
  --bb-green-300:#86B86F;--bb-green-600:#46703B;
  --bb-orange-300:#EBB363;--bb-orange-600:#9E5A0E;
  --bb-red-400:#E0705C;--bb-red-600:#B23A2B;--bb-red-950:#241010;

  --background:var(--bb-cream-50);--foreground:var(--bb-ink-850);
  --card:var(--bb-white);--card-foreground:var(--bb-ink-850);
  --popover:var(--bb-white);--popover-foreground:var(--bb-ink-850);
  --primary:var(--bb-gold-400);--primary-foreground:var(--bb-ink-max);
  --secondary:var(--bb-cream-100);--secondary-foreground:var(--bb-clay-800);
  --muted:var(--bb-cream-100);--muted-foreground:var(--bb-clay-500);
  --accent:var(--bb-gold-100);--accent-foreground:var(--bb-gold-800);
  --destructive:var(--bb-red-600);--destructive-foreground:var(--bb-white);
  --success:var(--bb-green-600);--success-foreground:var(--bb-white);
  --warning:var(--bb-orange-600);--warning-foreground:var(--bb-white);
  --border:var(--bb-cream-200);--input:var(--bb-cream-300);--ring:var(--bb-gold-700);

  --warning-muted:#F8E2C2;--warning-muted-foreground:#7C4A0C;
  --destructive-muted:#F6DCD6;--destructive-muted-foreground:#8C2C1E;

  --bb-space-2xs:.25rem;--bb-space-xs:.5rem;--bb-space-sm:.75rem;--bb-space-md:1rem;
  --bb-space-lg:1.5rem;--bb-space-xl:2rem;--bb-space-2xl:3rem;--bb-space-3xl:4rem;
  --bb-radius-sm:.5rem;--bb-radius-md:.625rem;--bb-radius-lg:.75rem;--bb-radius-xl:1rem;--bb-radius-full:9999px;
  --radius:var(--bb-radius-lg);
  --bb-content-max:30rem;--bb-content-wide:70rem;/* wide desktop cap ~1120px (#175) */
  --bb-touch-min:2.75rem;--bb-control-height:3rem;--bb-sidenav:15rem;/* 240px */
  --bb-elevation-sm:0 1px 2px 0 rgb(42 34 22 / .08);
  --bb-elevation-md:0 4px 12px -2px rgb(42 34 22 / .12);
  --bb-elevation-lg:0 12px 32px -8px rgb(42 34 22 / .20);
  --font-sans:'Assistant',system-ui,-apple-system,'Segoe UI','Noto Sans Hebrew',Arial,sans-serif;
}
.dark{
  color-scheme:dark;
  --background:var(--bb-ink-950);--foreground:var(--bb-cream-100);
  --card:var(--bb-ink-900);--card-foreground:var(--bb-cream-100);
  --popover:var(--bb-ink-900);--popover-foreground:var(--bb-cream-100);
  --primary:var(--bb-gold-400);--primary-foreground:var(--bb-ink-max);
  --secondary:var(--bb-ink-800);--secondary-foreground:var(--bb-cream-150);
  --muted:var(--bb-ink-800);--muted-foreground:var(--bb-clay-300);
  --accent:var(--bb-gold-950);--accent-foreground:var(--bb-gold-200);
  --destructive:var(--bb-red-400);--destructive-foreground:var(--bb-red-950);
  --success:var(--bb-green-300);--success-foreground:var(--bb-ink-950);
  --warning:var(--bb-orange-300);--warning-foreground:var(--bb-ink-max);
  --border:var(--bb-ink-750);--input:var(--bb-ink-700);--ring:var(--bb-gold-400);
  --success-muted:#26301B;--success-muted-foreground:#A9C98C;
  --warning-muted:#3A2A11;--warning-muted-foreground:#EBB363;
  --destructive-muted:#3A211B;--destructive-muted-foreground:#EB9384;
  --bb-elevation-sm:0 1px 2px 0 rgb(0 0 0 / .40);
  --bb-elevation-md:0 4px 12px -2px rgb(0 0 0 / .50);
  --bb-elevation-lg:0 16px 40px -8px rgb(0 0 0 / .65);
}

*{box-sizing:border-box}
.page{font-family:var(--font-sans);background:#e7ded0;color:#2A2216;margin:0;padding:24px;min-height:100vh;font-weight:400}
@media (prefers-color-scheme:dark){.page{background:#0e0b06;color:#F1E7D5}}
.page :where(h1,h2,h3,p,ul,figure,figcaption){margin:0}
.page ul{list-style:none;padding:0}
.page button{font-family:inherit;cursor:pointer}

/* page toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:1320px;margin:0 auto 8px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px)}
@media (prefers-color-scheme:dark){.toolbar{background:rgba(30,25,16,.55)}}
.toolbar h2{font-size:16px;font-weight:700;margin-inline-end:auto}
.toolbar .sub{font-size:13px;opacity:.7;font-weight:400}
.tgl{display:inline-flex;border:1px solid rgba(0,0,0,.15);border-radius:9999px;overflow:hidden}
.tgl button{border:0;background:transparent;padding:8px 14px;font-size:13px;font-weight:500;color:inherit}
.tgl button[aria-pressed=true]{background:var(--bb-gold-400);color:var(--bb-ink-max)}

.frames{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;max-width:1360px;margin:0 auto}
.frame{margin:0}
.frame-cap{font-size:13px;font-weight:600;margin-bottom:8px;opacity:.85;text-align:center}
.frame-cap small{display:block;font-weight:400;opacity:.7}
.scroll{overflow-x:auto;border-radius:20px;box-shadow:0 18px 50px -18px rgba(30,20,8,.5)}
.device{container-type:inline-size;background:var(--background);color:var(--foreground);border-radius:20px;overflow:hidden}
.frame--mobile .device{border:8px solid #241a0c}
.frame--tablet .device,.frame--desktop .device{border:1px solid rgba(0,0,0,.12)}

/* ===== icons ===== */
.ic{inline-size:1.25rem;block-size:1.25rem;flex:none;fill:currentColor}
.ic--lg{inline-size:1.5rem;block-size:1.5rem}
.ic--sm{inline-size:1rem;block-size:1rem}
[dir=rtl] .ic--dir{transform:scaleX(-1)}

/* ===== the app shell ===== */
.app{display:flex;flex-direction:column;min-block-size:640px;background:var(--background);color:var(--foreground);font-size:1rem;line-height:1.5;position:relative}
.frame--mobile .app{min-block-size:720px}

.brand-word{font-weight:800;letter-spacing:0}

/* mobile header */
.mheader{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:var(--bb-space-md);background:var(--card);border-block-end:1px solid var(--border)}
.icon-btn{inline-size:var(--bb-touch-min);block-size:var(--bb-touch-min);display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;border:1px solid var(--input);background:var(--card);color:var(--muted-foreground)}

/* side nav (desktop) */
.sidenav{display:none;flex-direction:column;inline-size:var(--bb-sidenav);flex:none;background:var(--card);border-inline-end:1px solid var(--border);padding:var(--bb-space-md) var(--bb-space-sm);gap:var(--bb-space-xs)}
.brand{display:flex;align-items:center;gap:.625rem;padding:.5rem .625rem var(--bb-space-md)}
.brand-mark{inline-size:2rem;block-size:2rem;border-radius:.5rem;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:800;font-size:1.05rem}
.brand .brand-word{font-size:1.125rem}
.nav-list{display:flex;flex-direction:column;gap:.25rem}
.nav-item{display:flex;align-items:center;gap:.75rem;min-block-size:var(--bb-control-height);padding-inline:.625rem;border-radius:var(--bb-radius-md);color:var(--foreground);text-decoration:none;font-weight:500;position:relative}
.nav-item:hover{background:var(--accent);color:var(--accent-foreground)}
.nav-item.is-active{background:var(--accent);color:var(--accent-foreground)}
.nav-item.is-active::before{content:"";position:absolute;inset-inline-start:-.5625rem;inset-block:.5rem;inline-size:3px;border-radius:9999px;background:var(--primary)}
.nav-gate{margin-inline-start:auto;font-size:.625rem;font-weight:500;color:var(--muted-foreground);background:var(--muted);padding:.1rem .4rem;border-radius:9999px}
.nav-foot{margin-block-start:auto;padding-block-start:var(--bb-space-md);border-block-start:1px solid var(--border)}
.account{display:flex;align-items:center;gap:.625rem;inline-size:100%;min-block-size:var(--bb-control-height);padding:.375rem .5rem;border-radius:var(--bb-radius-md);border:0;background:transparent;color:var(--foreground);text-align:start}
.account:hover{background:var(--muted)}
.account-id{display:flex;flex-direction:column;line-height:1.2;margin-inline-end:auto}
.account-name{font-weight:600;font-size:.9375rem}
.account-role{font-size:.75rem;color:var(--muted-foreground)}
.av{inline-size:2rem;block-size:2rem;border-radius:9999px;background:var(--accent);color:var(--accent-foreground);display:grid;place-items:center;font-weight:600;font-size:.8125rem;flex:none}
.av--me{background:var(--primary);color:var(--primary-foreground)}

/* content */
.content{flex:1;min-inline-size:0;overflow:auto}
.content-inner{max-inline-size:var(--bb-content-max);margin-inline:auto;padding:var(--bb-space-md);display:flex;flex-direction:column;gap:var(--bb-space-lg)}
.content-head{display:flex;flex-direction:column;gap:var(--bb-space-sm)}
.screen-title{font-size:1.5rem;line-height:1.25;font-weight:600}
.content-actions{display:flex;align-items:center;gap:var(--bb-space-sm)}
.search{display:none;align-items:center;gap:.5rem;flex:1;min-block-size:var(--bb-control-height);padding-inline:.75rem;border:1px solid var(--input);border-radius:var(--bb-radius-md);color:var(--muted-foreground);font-size:.9375rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-block-size:var(--bb-control-height);padding-inline:var(--bb-space-md);border-radius:var(--bb-radius-md);border:0;font-weight:500;font-size:.9375rem}
.btn--primary{background:var(--primary);color:var(--primary-foreground)}
.btn--primary .ic{fill:var(--primary-foreground)}

.board{display:flex;flex-direction:column;gap:var(--bb-space-md)}
.col{display:flex;flex-direction:column;gap:var(--bb-space-sm)}
.col-head{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.875rem;color:var(--muted-foreground)}
.col-count{font-size:.75rem;background:var(--muted);color:var(--muted-foreground);border-radius:9999px;padding:.05rem .45rem;font-variant-numeric:tabular-nums}
.col-body{display:flex;flex-direction:column;gap:var(--bb-space-sm)}

.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--bb-radius-lg);padding:var(--bb-space-md);display:flex;flex-direction:column;gap:var(--bb-space-sm)}
.card-top{display:flex;align-items:flex-start;gap:.5rem}
.card-title{font-size:1.125rem;line-height:1.35;font-weight:600;flex:1}
.card-meta{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.8125rem;font-weight:500;padding:.2rem .55rem;border-radius:9999px}
.badge .ic{inline-size:1rem;block-size:1rem}
.badge--todo{background:var(--muted);color:var(--muted-foreground)}
.badge--prog{background:var(--accent);color:var(--accent-foreground)}
.badge--done{background:var(--success-muted);color:var(--success-muted-foreground)}
.badge--warn{background:var(--warning-muted);color:var(--warning-muted-foreground);margin-inline-start:auto}
.due{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--muted-foreground)}
.due .ic{inline-size:.9rem;block-size:.9rem}
.due--over{color:var(--destructive-muted-foreground);font-weight:600}
.avatars{margin-inline-start:auto;display:inline-flex}
.avatars .av{inline-size:1.6rem;block-size:1.6rem;font-size:.7rem;border:2px solid var(--card)}
.avatars .av+.av{margin-inline-start:-.5rem}

/* bottom nav (mobile) */
.bottomnav{position:sticky;bottom:0;z-index:5;display:flex;background:var(--card);border-block-start:1px solid var(--border);box-shadow:var(--bb-elevation-sm)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;min-block-size:3.5rem;padding:.5rem;text-decoration:none;font-size:.8125rem;font-weight:500;color:var(--muted-foreground)}
.bn-item.is-active{color:var(--accent-foreground)}
.bn-item .ic{inline-size:1.5rem;block-size:1.5rem}
.bn-dot{inline-size:.375rem;block-size:.375rem;border-radius:9999px;background:transparent}
.bn-item.is-active .bn-dot{background:var(--primary)}
.fab{position:absolute;inset-block-end:4.75rem;inset-inline-end:1rem;inline-size:3.5rem;block-size:3.5rem;border-radius:9999px;border:0;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:var(--bb-elevation-md);z-index:6}
.fab .ic{inline-size:1.5rem;block-size:1.5rem;fill:var(--primary-foreground)}

/* ============ breakpoints (container-based) ============ */
/* md 768px — shell flips: bottom-bar/header -> side nav. content single wide column. */
@container (min-width:768px){
  .mheader,.bottomnav,.fab{display:none}
  .app{flex-direction:row}
  .sidenav{display:flex}
  .search{display:flex}
  .content-inner{max-inline-size:var(--bb-content-wide);padding:var(--bb-space-xl) var(--bb-space-lg) var(--bb-space-2xl)}
  .content-head{flex-direction:row;align-items:center;justify-content:space-between;gap:var(--bb-space-md)}
  .content-actions{flex:0 0 auto;inline-size:auto}
  .search{inline-size:14rem;flex:0 0 auto}
}
/* lg 1024px — content compositions go multi-column (board becomes status columns). */
@container (min-width:1024px){
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--bb-space-lg);align-items:start}
}

  function applyLang(lang){
    var i = lang === 'he' ? 0 : 1;
    page.setAttribute('data-lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = dict[el.getAttribute('data-i18n')];
      if(v) el.textContent = v[i];
    });
    var dir = lang === 'he' ? 'rtl' : 'ltr';
    page.setAttribute('dir', dir);
    document.querySelectorAll('.device .app').forEach(function(a){ a.setAttribute('dir', dir); });
  }
  function applyTheme(theme){
    document.querySelectorAll('.frame:not(.frame--darklock) .app').forEach(function(a){
      a.classList.toggle('dark', theme === 'dark');
    });
  }
  // lock dark frame
  document.querySelectorAll('.frame--darklock .app').forEach(function(a){ a.classList.add('dark'); });

  document.getElementById('dirTgl').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
    applyLang(b.dataset.dir === 'rtl' ? 'he' : 'en');
  });
  document.getElementById('themeTgl').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
    applyTheme(b.dataset.theme);
  });

  applyLang('he');
})();
</script>
</div>
