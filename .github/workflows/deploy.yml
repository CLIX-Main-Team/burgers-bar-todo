name: Deploy

# Production deploy pipeline (ADR-0017; repointed 2026-08 to the owner's own Render + Vercel
# accounts). On free-tier Render there is no preDeployCommand, so the "a broken migration
# aborts the release" guarantee is rebuilt here: migrations are applied to the production
# database first, and only on success are the API and SPA deployed, so schema and code cut
# over together.
#
# Deploys are triggered via each platform's API rather than a magic deploy-hook URL: Render's
# Deploys API (RENDER_API_KEY) and the Vercel CLI (VERCEL_TOKEN) firing an explicit --prod
# deploy. Vercel's own push-triggered builds are turned off (Ignore Build Step = `exit 0` on
# the project) so this workflow stays the only trigger, preserving deploy ordering — API
# before SPA, same as before, so a new client never briefly talks to an older server.
#
# This runs only after the CI workflow (ADR-0012: lint, typecheck, tests, e2e) has
# gone green on main — CI enforcement is advisory (Pro-gated), so gating the deploy on
# workflow_run is what actually stops a red build from shipping. workflow_dispatch is
# kept for a manual re-deploy (e.g. re-firing the deploys after a config change).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Do NOT cancel a run in flight — interrupting a migration
# mid-apply is the one thing worse than a slow deploy; queue the next one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: migrate-then-deploy
    runs-on: ubuntu-latest
    # Skip unless CI actually succeeded. A manual workflow_dispatch has no triggering
    # run, so allow it through explicitly.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Apply committed Drizzle migrations to the external Supabase database. Idempotent
      # (already-applied migrations are skipped), so a push with no schema change is a
      # no-op. The prod DATABASE_URL is the Supabase session-pooler string and carries
      # its own sslmode (see docs/deploy/readme.md). A failure here fails the job and
      # the deploy hooks below never fire.
      - name: Apply migrations to production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate --workspace @burgers/api

      # Migrations are live — now cut the code over. The API is deployed before the SPA
      # so a new client never briefly talks to an older server. curl -f makes a non-2xx
      # from the Render API fail the step.
      - name: Trigger Render API deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          echo "Triggering API deploy…"
          curl -fsS --retry 3 -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/services/srv-d9q5ot142hec739rq3eg/deploys

      # Vercel's own push-triggered build is disabled (Ignore Build Step); this explicit
      # --prod deploy through the CLI is what actually ships the SPA.
      - name: Trigger Vercel SPA deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_VuuEVTc7dqhexqkmsECdUONB
          VERCEL_PROJECT_ID: prj_YX2pVtR1wIMd2WwVM3lvZvSWffA5
        run: |
          set -euo pipefail
          echo "Triggering SPA deploy…"
          npx --yes vercel@latest deploy --prod --token="$VERCEL_TOKEN" --yes

      # The Hostinger VPS (2026-08 move) — the third target while the platforms run in
      # parallel; Render + Vercel above are retired at cutover, this step is what remains.
      # Reuses the hand-deploy script verbatim: ship HEAD via git archive, build ON the box,
      # swap containers, wait for the API healthcheck (a failed healthcheck fails this step).
      # Runs after migrations for the same reason Render does; secrets never ride the ship —
      # the box keeps its own /docker/burgers-bar/.env.prod, and the script refuses to run
      # if it is missing. The SSH key is the burgers_vps deploy key (key-only box — password
      # auth was disabled 2026-08-27).
      - name: Deploy to Hostinger VPS
        env:
          # NOT named VPS_SSH_KEY: the deploy script reads a variable of that exact name
          # as the key's file PATH, so exporting the secret under it hands the script the
          # key CONTENT as a filename (the first CI run failed exactly that way).
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/burgers_vps
          chmod 600 ~/.ssh/burgers_vps
          ssh-keyscan -H 31.97.157.41 >> ~/.ssh/known_hosts 2>/dev/null
          ./scripts/deploy-vps.sh
